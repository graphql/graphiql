name: Build & Test PR w/ GraphQL Regressions
on:
  push:
    # only on merge to main.
    # it's rare that this workflow would
    # show us an error, but when it does it's important!
    branches: [main]
    # don't run this regression suite if we don't need to
    paths-ignore:
      - '**.md'
      - 'examples'
      - '!examples/monaco-graphql-webpack'

# TODO: test matrix?

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        release:
          # test against the latest 16.x version, which might be newer than what we have
          - '^16'
          # test against the oldest version we support
          - '16.11.0'
          # test against the latest 17.x version
          - '^17'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: yarn
      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node_modules-${{hashFiles('yarn.lock')}}
          restore-keys: node_modules-
      - name: Install dependencies
        run: yarn install --immutable

      - name: Force GraphQL ${{ matrix.release }} solution
        run: yarn repo:resolve graphql@${{ matrix.release }}

      - run: yarn install --no-immutable

      - name: Build
        run: yarn build

      - name: Unit Tests
        run: yarn test

      - name: Cypress (GraphQL 16)
        if: matrix.release != '^17'
        env:
          CYPRESS_excludeSpecPattern: cypress/e2e/incremental-delivery.cy.ts
        run: yarn e2e

      - name: Cypress (GraphQL 17)
        if: matrix.release == '^17'
        run: yarn e2e
