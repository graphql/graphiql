name: PR
on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
      - run: pnpm build --output-logs=new-only

  cspell:
    name: CSpell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint-cspell

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:lockfile
      - run: pnpm format-check
      - run: pnpm svgo-check

  dedupe-check:
    name: pnpm Dedupe Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dedupe --check

  vitest:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          restore-build: true
      - run: pnpm --filter @graphiql/react exec playwright install --with-deps chromium
      - run: pnpm test --output-logs=new-only

  graphql-16-compatibility:
    name: GraphQL 16 Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm repo:resolve graphql@16.14.2
      - run: pnpm install --no-frozen-lockfile
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
      - run: pnpm build --output-logs=new-only
      - run: pnpm --filter @graphiql/react exec playwright install --with-deps chromium
      - run: pnpm test --output-logs=new-only

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm oxlint

  types-check:
    name: Types Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          restore-build: true
      - run: |
          pnpm exec turbo run types:check --output-logs=new-only
          pnpm exec tsc --noEmit -p scripts/tsconfig.json

  e2e:
    name: Cypress
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          restore-build: true
      - run: pnpm build:graphiql --output-logs=new-only
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter graphiql-e2e exec cypress install
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          install: false
          command: pnpm --filter graphiql-e2e e2e:built
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-screenshots
          path: packages/graphiql-e2e/cypress/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-videos
          path: packages/graphiql-e2e/cypress/videos
          if-no-files-found: ignore

  pkg-pr-new:
    name: Canary Builds
    runs-on: ubuntu-latest
    needs: [build, lint, vitest, e2e]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Turbo cache
        uses: ./.github/actions/turbo-cache
        with:
          restore-build: true
      - run: pnpm build --output-logs=new-only
      - run: pnpm dlx pkg-pr-new publish --comment=off './packages/*'

  license-check:
    name: Check Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: License Check
        run: pnpm license-check
