name: Update CDN Example Dependencies

on:
  schedule:
    # Run every Monday at 10:00 UTC
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allow manual triggering
  release:
    types: [released]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Check and Update CDN Dependencies
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Check GraphiQL latest
        id: version
        run: |
          latest=$(npm view graphiql@latest version)
          if [[ "$latest" == 6.* ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "GraphiQL $latest is still latest; keeping the v6 prerelease example"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate index.html
        id: generate
        if: steps.version.outputs.ready == 'true'
        run: |
          node .github/scripts/update-cdn-versions.mjs > "$RUNNER_TEMP/graphiql-cdn.html"
          mv "$RUNNER_TEMP/graphiql-cdn.html" examples/graphiql-cdn/index.html

      - name: Check for Changes
        id: check-changes
        if: steps.version.outputs.ready == 'true'
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.version.outputs.ready == 'true' && steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(cdn-example): update dependencies to latest versions'
          title: 'chore(cdn-example): update dependencies to latest versions'
          body: |
            This PR automatically updates the CDN example dependencies to their latest versions.

            🤖 This PR was automatically generated automatically, beep boop
          branch: automated/update-cdn-example-dependencies
          base: main
          delete-branch: true
          labels: |
            dependencies
            automated
