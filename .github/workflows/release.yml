name: Release

on:
  push:
    branches:
      - 5.x.x

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel a publish partway through!
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    environment: deploy
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # To create a release, and to push branches:
      contents: write

      # To create/maintain the Changesets pull request
      pull-requests: write

      # PRs are backed by issues; this helps with stuff like reading labels/etc
      issues: read

      # To enable trusted publishing
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: ./.github/actions/turbo-cache

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm ci:version
          publish: pnpm release
          createGithubReleases: false

      # The action only pushes tags when it creates GitHub releases. Keep the
      # maintenance tags without changing GitHub's latest release.
      - name: Push maintenance release tags
        if: ${{ steps.changesets.outputs.published == 'true' }}
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          while IFS= read -r tag; do
            git push origin "refs/tags/$tag"
          done < <(jq -r '.[] | "\(.name)@\(.version)"' <<< "$PUBLISHED_PACKAGES")
