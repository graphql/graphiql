name: Cache Turbo tasks
description: Restore and save local Turbo task results between CI jobs and runs.
runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'yarn.lock') }}-${{ github.sha }}-${{ github.job }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'yarn.lock') }}-${{ github.sha }}-
          turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'yarn.lock') }}-
