packages:
  - packages/*
  - functions
  - packages/graphiql-e2e/test
  - examples/monaco-graphql-webpack
  - examples/monaco-graphql-nextjs
  - examples/monaco-graphql-react-vite
  - examples/graphiql-vite
  - examples/graphiql-vite-react-router
  - examples/graphiql-webpack

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - monaco-editor@0.57.0
engineStrict: true
nodeLinker: isolated
linkWorkspacePackages: true
preferWorkspacePackages: true

allowBuilds:
  '@vscode/vsce-sign': false
  core-js: false
  cypress: true
  ejs: false
  esbuild: false
  fsevents: false
  keytar: false
  msw: false
  sharp: false

overrides:
  '@babel/traverse': ^7.23.2
  '@types/node': ^24
  # Newer eligible releases introduce a separate authentication advisory.
  '@vscode/vsce>@azure/identity': 4.13.0
  # Stay below the affected esbuild patches while satisfying tsup's range.
  'tsup>esbuild': 0.27.2
  'start-server-and-test>wait-on': 7.2.0
  # New accessibility rules need a separate review of existing stories.
  axe-core: 4.13.0
  dompurify@3: ^3.4.17
  eslint: ^10.12.0
  postcss@8: ^8.5.23
  vscode-languageserver-types: 3.17.3
  markdown-it: 15.0.3
  react: 19.2.7
  react-dom: 19.2.7
  vite: 8.2.4

patchedDependencies:
  js-green-licenses@4.0.0: resources/patches/js-green-licenses+4.0.0.patch
