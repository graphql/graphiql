<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL 6 with React 19</title>
    <style>
      body {
        margin: 0;
      }

      #graphiql {
        height: 100dvh;
      }

      .loading {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@6.0.0-beta.3/dist/style.css"
      integrity="sha384-AK10pVueS6S54GZs2DL+Nt+sEEJdytj5av+DSnT+wDInKC9GCGCgt+f95tBbO7wE"
      crossorigin="anonymous"
    />
    <!--
     * Note:
     * The ?standalone flag bundles the module along with all of its `dependencies`, excluding `peerDependencies`, into a single JavaScript file.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/": "https://esm.sh/react@19.3.0/",
          "react-dom": "https://esm.sh/react-dom@19.3.0",
          "react-dom/": "https://esm.sh/react-dom@19.3.0/",
          "graphiql": "https://esm.sh/graphiql@6.0.0-beta.3?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@6.0.0-beta.3/",
          "@graphiql/react": "https://esm.sh/@graphiql/react@1.0.0-beta.3?standalone&external=react,react-dom,graphql,@graphiql/toolkit",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@1.0.0-beta.1?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2"
        },
        "integrity": {
          "https://esm.sh/react@19.3.0": "sha384-gq3XRS6InsfZ3Lv6d+6mBuySvNkEX/1Ciw3jSlg9gL82444AmhVcwtYbpJfKbDqf",
          "https://esm.sh/react-dom@19.3.0": "sha384-xodfSorG86jrGERFAa4P/93Hfsvm7H8zpgSaybN6ruXaACScu/R7nOuoDgCfep8l",
          "https://esm.sh/graphiql@6.0.0-beta.3": "sha384-qE4gdt5mqfer2mfCf40odw/rcYqe3Cvi+BLs+5TIs/6YNZpXc8VQcKoJY9vfa0vZ",
          "https://esm.sh/graphiql@6.0.0-beta.3?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-atWpRF+zwrCPbZpnRC6ShnElDunVXOLf+GVqBrC1hKJN5GYilkoYvN1oSy/bqRMJ",
          "https://esm.sh/@graphiql/react@1.0.0-beta.3?standalone&external=react,react-dom,graphql,@graphiql/toolkit": "sha384-0fFsGnxFGDZ5K9QJUsw8oAyP/gdBs70w8jpbglT3vVbk/k8CJ5IFmmKcUxqWDfTl",
          "https://esm.sh/@graphiql/toolkit@1.0.0-beta.1?standalone&external=graphql": "sha384-f752sRkr4/2iRpE1ybnGkezFGhRHfZcgzfN/RWb6/ouQ6JCmN3WpwypYTHzuRX49",
          "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp"
        }
      }
    </script>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import { GraphiQL } from 'graphiql';
      import { createTransport } from '@graphiql/toolkit';
      import EditorWorker from 'https://esm.sh/monaco-editor@0.57.0/editor/editor.worker.js?worker';
      import JsonWorker from 'https://esm.sh/monaco-editor@0.57.0/languages/features/json/json.worker.js?worker';
      import GraphQLWorker from 'https://esm.sh/monaco-graphql@2.0.0-beta.1/esm/graphql.worker.js?worker&deps=monaco-editor@0.57.0,graphql-language-service@6.0.0-beta.1';

      // Match the worker versions to @graphiql/react's published dependencies.
      globalThis.MonacoEnvironment = {
        getWorker(_workerId, label) {
          if (label === 'graphql') return new GraphQLWorker();
          if (label === 'json') return new JsonWorker();
          return new EditorWorker();
        },
      };

      const transport = createTransport({
        url: 'https://countries.trevorblades.com',
      });

      function App() {
        return React.createElement(GraphiQL, {
          transport,
          defaultQuery: 'query Countries { countries { code name } }',
        });
      }

      const container = document.getElementById('graphiql');
      const root = ReactDOM.createRoot(container);
      root.render(React.createElement(App));
    </script>
  </head>
  <body>
    <div id="graphiql">
      <div class="loading">Loading…</div>
    </div>
  </body>
</html>
