<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL 6 with React 19</title>
    <style>
      body {
        margin: 0;
      }

      #graphiql {
        height: 100dvh;
      }

      .loading {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@6.0.0-rc.3/dist/style.css"
      integrity="sha384-s/Lu70Z5pQJQRctNOdRQLkkH9/Vg94D5arMF7Tcj/P3UAgX4sNzJDVVXL3ShYJ24"
      crossorigin="anonymous"
    />
    <!--
     * Note:
     * The ?standalone flag bundles the module along with all of its `dependencies`, excluding `peerDependencies`, into a single JavaScript file.
     * `@emotion/is-prop-valid` is a shim to remove the console error ` module "@emotion /is-prop-valid" not found`. Upstream issue: https://github.com/motiondivision/motion/issues/3126
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.1",
          "react/": "https://esm.sh/react@19.3.1/",
          "react-dom": "https://esm.sh/react-dom@19.3.1",
          "react-dom/": "https://esm.sh/react-dom@19.3.1/",
          "graphiql": "https://esm.sh/graphiql@6.0.0-rc.3?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@6.0.0-rc.3/",
          "graphiql/setup-workers/esm.sh": "https://esm.sh/graphiql@6.0.0-rc.3/setup-workers/esm.sh?deps=@graphiql/react@1.0.0-rc.4",
          "@graphiql/react": "https://esm.sh/@graphiql/react@1.0.0-rc.4?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@1.0.0-rc.1?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        },
        "integrity": {
          "https://esm.sh/react@19.3.1": "sha384-ut1U+oIs0ClaOE7uF1+DZAaHVvYvEJZME3mUuqn95yVqQ70a+8u2LN2LD37JgJkO",
          "https://esm.sh/react-dom@19.3.1": "sha384-FKbbSw/nINZRM0ej/iwjfXbJeAZMJdBKqKmn/I+aIM4Io5qupmM8sZJxaJZDO0sv",
          "https://esm.sh/graphiql@6.0.0-rc.3": "sha384-Z+3xf1x3kf4skqNEMwNF8QJ6N7tHMF24eD57y4ZHjXLhUT10u1/doun9P8I3ZII6",
          "https://esm.sh/graphiql@6.0.0-rc.3/setup-workers/esm.sh?deps=@graphiql/react@1.0.0-rc.4": "sha384-+jBHE6k96ISWJi9tzw3tSXhsgn6JdVU/Za8Thu053VRHsdQWqdWzdPmh6DBYFToX",
          "https://esm.sh/graphiql@6.0.0-rc.3?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-WY0NWt0THJhl2ZoNk7GhVAQaq9DiAsPbDeB0lAGlXQi8fo+cWaBrK975qE+i8iBs",
          "https://esm.sh/@graphiql/react@1.0.0-rc.4?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-StiN6MaVXrevxRdzQ6ulUG+vQGEejKXGG/gflTTn1+UwrVP1yqs9DnDFCYFHo8KQ",
          "https://esm.sh/@graphiql/toolkit@1.0.0-rc.1?standalone&external=graphql": "sha384-MYU+ZKgxpEJEqtBGGNDsMTJwtjDyI8FLF1snKf+K29G4gLZP9vjHYx7dQqBl5gak",
          "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp"
        }
      }
    </script>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import { GraphiQL } from 'graphiql';
      import { createTransport } from '@graphiql/toolkit';
      import 'graphiql/setup-workers/esm.sh';

      const transport = createTransport({
        url: 'https://countries.trevorblades.com',
      });

      function App() {
        return React.createElement(GraphiQL, {
          transport,
          defaultEditorToolsVisibility: true,
        });
      }

      const container = document.getElementById('graphiql');
      const root = ReactDOM.createRoot(container);
      root.render(React.createElement(App));
    </script>
  </head>
  <body>
    <div id="graphiql">
      <div class="loading">Loading…</div>
    </div>
  </body>
</html>
